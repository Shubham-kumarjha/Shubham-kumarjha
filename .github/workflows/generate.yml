name: Generate Profile SVGs

on:
  schedule:
    - cron: '0 0 * * *' # Har 24 ghante me auto-run hoga
  workflow_dispatch: # Manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pillow rembg requests beautifulsoup4

      - name: Run Info Card Script
        run: |
          python scripts/make_info_card.py info-card.svg

      - name: Run ASCII SVG Script
        run: |
          python scripts/make_ascii_svg.py source_photo.jpg ascii-portrait.svg || python scripts/make_ascii_svg.py dummy ascii-portrait.svg

      - name: Commit and Push Generated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add info-card.svg ascii-portrait.svg
          git commit -m "auto: update profile SVGs" || exit 0
          git push
